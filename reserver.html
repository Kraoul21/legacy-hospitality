<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réserver une activité — Shelter&amp;Co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/urbain.css">
  <style>
    :root { --accent: #6E4FD8; --soft: #EFE9FF; }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 28px 24px 140px;
      animation: rise .7s var(--ease) both;
    }

    .back { margin-bottom: 26px; }

    .cat { color: var(--muted); margin-bottom: 10px; }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 6.5vw, 3.8rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 30px; }

    .fact {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--stroke);
      font-size: 0.9rem;
    }

    .fact.cost { background: var(--soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); font-weight: 600; }
    .fact.earn { color: var(--violet-ink); font-weight: 600; }
    .lp { width: 20px; height: 20px; }

    /* ---------- étapes ---------- */
    .step {
      padding: 22px;
      margin-bottom: 16px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
    }

    .step h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
    }

    .step h2 .n {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
    }

    .days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

    .day {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--stroke-2);
      background: #fff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background .25s ease, border-color .25s ease, transform .3s var(--ease), color .25s ease;
    }

    .day:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
    .day b { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.35rem; line-height: 1; }
    .day .wd { color: var(--muted); }
    .day .count { color: var(--violet-ink); font-size: 0.8rem; font-weight: 500; }
    .day .tag {
      align-self: flex-start;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 0.62rem;
    }

    .day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .count { color: rgba(255, 255, 255, 0.85); }
    .day[aria-pressed="true"] .tag { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .day:disabled { opacity: .45; cursor: not-allowed; }

    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }

    .slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 12px 8px;
      border-radius: 16px;
      border: 1px solid var(--stroke-2);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: background .25s ease, border-color .25s ease, transform .3s var(--ease), color .25s ease;
    }

    .slot b { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .slot small { color: var(--muted); font-size: 0.72rem; }
    .slot:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
    .slot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .slot[aria-pressed="true"] small { color: rgba(255, 255, 255, 0.85); }

    .slot:disabled {
      cursor: not-allowed;
      background: rgba(23, 24, 27, 0.03);
      border-style: dashed;
    }

    .slot:disabled b { color: rgba(23, 24, 27, 0.35); text-decoration: line-through; }

    .hint { color: var(--muted); }

    /* ---------- barre de confirmation ---------- */
    .bar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 10;
      width: min(840px, calc(100vw - 32px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 14px 14px 22px;
      border-radius: 999px;
      background: rgba(23, 24, 27, 0.92);
      color: #F5F5F7;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 50px -20px rgba(23, 24, 27, 0.55);
    }

    .bar .sum { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .bar .sum b { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .sum span { color: rgba(245, 245, 247, 0.7); font-size: 0.82rem; }
    .bar .sum .warn { color: #FFB199; }

    .confirm {
      flex-shrink: 0;
      padding: 14px 22px;
      border: none;
      border-radius: 999px;
      background: #B79BFF;
      color: #17181B;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: filter .2s ease, transform .3s var(--ease), opacity .2s ease;
    }

    .confirm:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-2px); }
    .confirm:disabled { opacity: .4; cursor: not-allowed; }

    /* ---------- confirmation ---------- */
    .done { display: none; text-align: center; padding: 30px 22px; }
    .confirmed .picker, .confirmed .bar { display: none; }
    .confirmed .done { display: block; animation: rise .6s var(--ease) both; }

    .check {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 18px 40px -16px var(--accent);
    }

    .check svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    .done h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: -0.02em;
    }

    .recap {
      list-style: none;
      max-width: 460px;
      margin: 22px auto;
      text-align: left;
    }

    .recap li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--stroke); }
    .recap li:first-child { border-top: none; }
    .recap .k { color: var(--muted); }
    .recap .v { font-weight: 600; text-align: right; }

    .done .note { color: var(--muted); margin-bottom: 22px; }
    .done .btn-primary { padding: 14px 22px; color: #fff; }
    .done-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    .done-actions .btn { padding: 14px 22px; }

    .error { color: var(--coral-ink); margin-top: 6px; min-height: 1.2em; }

    .missing { padding: 40px 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.2rem; }

    @media (max-width: 640px) {
      main { padding: 22px 16px 150px; }
      .days { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .step { padding: 18px; }
      .bar { border-radius: 26px; flex-direction: column; align-items: stretch; padding: 14px; }
      .confirm { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- pièce Legacy Points -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="lp-logo" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15" fill="#B79BFF" stroke="#121316" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="11.5" fill="none" stroke="#121316" stroke-width="1" stroke-dasharray="1.6 1.8"/>
      <path d="M12.5 9.5v13h8" fill="none" stroke="#121316" stroke-width="3.2" stroke-linecap="square"/>
    </symbol>
  </svg>

  <main id="main">
    <a class="back mono" id="back" href="mon-profil.html#portefeuille">← Mon portefeuille</a>
    <div id="page"></div>
  </main>

  <script src="assets/activites-data.js"></script>
  <script>
    const ACT = window.LHG_ACTIVITES;
    const params = new URLSearchParams(location.search);
    // Site en ligne (GitHub Pages) : pas de serveur serveur.py, donc pas d'API /api/…
    const HAS_SERVER = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    const ref = params.get('ref') || '';
    const activity = ACT.ACTIVITIES.find((a) => a.id === params.get('activite'));
    const stay = ACT.STAYS[ref];
    const page = document.getElementById('page');

    const nfBase = new Intl.NumberFormat('fr-FR');
    const nf = (n) => nfBase.format(n).replace(/ /g, ' ');
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const lp = '<svg class="lp" viewBox="0 0 32 32" aria-hidden="true"><use href="#lp-logo"/></svg>';
    const toMin = (h) => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
    const fmtDay = (iso, opts) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', opts);

    if (ref) {
      document.getElementById('back').href = 'mon-profil.html?ref=' + encodeURIComponent(ref) + '#portefeuille';
    }

    let chosenDay = null;
    let chosenHour = null;

    if (!activity || !stay) {
      page.innerHTML = '<p class="missing">Activité ou réservation introuvable.</p>';
    } else {
      render();
    }

    // Créneaux du jour, en tenant compte des activités déjà réservées pendant le séjour
    function slotsOf(day) {
      const booked = ACT.getBookings(ref).filter((b) => b.day === day);
      return ACT.slotsFor(activity, stay, day).map((s) => {
        if (!s.available) return s;
        const start = toMin(s.hour);
        const end = start + activity.duration;
        const clash = booked.find((b) => {
          const other = ACT.ACTIVITIES.find((a) => a.id === b.activity);
          const bs = toMin(b.hour);
          return start < bs + (other ? other.duration : 60) && bs < end;
        });
        return clash ? { ...s, available: false, reason: 'activité déjà prévue' } : s;
      });
    }

    function render() {
      document.title = `Réserver : ${activity.name} — Shelter&Co`;
      const days = ACT.stayDays(stay);
      page.innerHTML = `
        <div class="picker">
          <p class="cat mono">${esc(activity.cat)} · Réservation</p>
          <h1>${esc(activity.name)}</h1>
          <div class="facts">
            <span class="fact cost">${lp}${nf(activity.cost)} LP</span>
            <span class="fact earn">+${nf(ACT.pointsFor(activity))} pts de fidélité</span>
            <span class="fact">${esc(activity.detail)}</span>
            <span class="fact">${esc(activity.place)}</span>
          </div>

          <section class="step">
            <h2><span class="n">1</span> Choisissez une date</h2>
            <div class="days" role="group" aria-label="Dates de votre séjour">
              ${days.map((day) => {
                const free = slotsOf(day).filter((s) => s.available).length;
                const tag = day === stay.arrival ? 'Arrivée' : day === stay.departure ? 'Départ' : '';
                return `<button class="day" type="button" data-day="${day}" aria-pressed="false" ${free ? '' : 'disabled'}>
                  <span class="wd mono">${esc(fmtDay(day, { weekday: 'long' }))}</span>
                  <b>${esc(fmtDay(day, { day: 'numeric', month: 'short' }))}</b>
                  <span class="count">${free ? `${free} créneau${free > 1 ? 'x' : ''}` : 'Complet'}</span>
                  ${tag ? `<span class="tag mono">${tag}</span>` : ''}
                </button>`;
              }).join('')}
            </div>
          </section>

          <section class="step">
            <h2><span class="n">2</span> Choisissez un horaire</h2>
            <div id="slots"><p class="hint">Sélectionnez d’abord une date.</p></div>
          </section>
          <p class="error mono" id="error" role="alert"></p>
        </div>

        <div class="bar">
          <div class="sum">
            <b id="sum-title">${esc(activity.name)}</b>
            <span id="sum-detail">Choisissez une date et un horaire</span>
          </div>
          <button class="confirm" id="confirm" type="button" disabled>Confirmer</button>
        </div>

        <section class="done" id="done" aria-live="polite"></section>`;

      page.querySelectorAll('.day').forEach((b) => b.addEventListener('click', () => pickDay(b.dataset.day)));
      document.getElementById('confirm').addEventListener('click', confirmBooking);

      // on présélectionne le premier jour qui a des créneaux
      const first = page.querySelector('.day:not(:disabled)');
      if (first) pickDay(first.dataset.day);
    }

    function pickDay(day) {
      chosenDay = day;
      chosenHour = null;
      page.querySelectorAll('.day').forEach((b) => b.setAttribute('aria-pressed', b.dataset.day === day));
      const slots = slotsOf(day);
      document.getElementById('slots').innerHTML = `<div class="slots" role="group" aria-label="Horaires disponibles">
        ${slots.map((s) => `<button class="slot" type="button" data-hour="${s.hour}" aria-pressed="false" ${s.available ? '' : 'disabled'}>
          <b>${s.hour.replace(':', 'h')}</b>
          <small>${s.available ? 'Disponible' : esc(s.reason)}</small>
        </button>`).join('')}
      </div>`;
      document.querySelectorAll('.slot').forEach((b) => b.addEventListener('click', () => pickHour(b.dataset.hour)));
      updateBar();
    }

    function pickHour(hour) {
      chosenHour = hour;
      document.querySelectorAll('.slot').forEach((b) => b.setAttribute('aria-pressed', b.dataset.hour === hour));
      updateBar();
    }

    function label() {
      return `${fmtDay(chosenDay, { weekday: 'short', day: 'numeric', month: 'short' })} · ${chosenHour.replace(':', 'h')}`;
    }

    function updateBar() {
      const after = ACT.balance(ref) - activity.cost;
      const detail = document.getElementById('sum-detail');
      const btn = document.getElementById('confirm');
      if (after < 0) {
        detail.innerHTML = `<span class="warn">Solde insuffisant : il vous manque ${nf(-after)} LP</span>`;
        btn.disabled = true;
        return;
      }
      if (!chosenHour) {
        detail.textContent = chosenDay ? 'Choisissez un horaire' : 'Choisissez une date et un horaire';
        btn.disabled = true;
        return;
      }
      detail.textContent = `${label()} · ${nf(activity.cost)} LP · solde après : ${nf(after)} LP · +${nf(ACT.pointsFor(activity))} pts de fidélité`;
      btn.disabled = false;
    }

    async function confirmBooking() {
      const btn = document.getElementById('confirm');
      const error = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = 'Confirmation…';
      error.textContent = '';
      const when = label();
      let emailed = false;
      if (HAS_SERVER) try {
        // la réception reçoit la réservation (même circuit que la page Bienvenue)
        const res = await fetch('/api/welcome', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ref,
            types: ['Autre'],
            message: `Réservation d’activité : ${activity.name} — ${when} (${activity.cost} Legacy Points, ${activity.place}).`,
            consent: true,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Réservation impossible pour le moment.');
        emailed = !!data.emailed;
      } catch (e) {
        error.textContent = e instanceof TypeError
          ? 'Connexion impossible : merci de réessayer ou de contacter la réception.'
          : e.message;
        btn.textContent = 'Confirmer';
        btn.disabled = false;
        return;
      }

      ACT.addBooking(ref, { activity: activity.id, day: chosenDay, hour: chosenHour, cost: activity.cost, label: when });
      showDone(when, emailed);
    }

    function showDone(when, emailed) {
      const back = document.getElementById('back').href;
      document.getElementById('done').innerHTML = `
        <div class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2>Réservation confirmée</h2>
        <ul class="recap">
          <li><span class="k">Activité</span><span class="v">${esc(activity.name)}</span></li>
          <li><span class="k">Date</span><span class="v">${esc(fmtDay(chosenDay, { weekday: 'long', day: 'numeric', month: 'long' }))}</span></li>
          <li><span class="k">Horaire</span><span class="v">${esc(chosenHour.replace(':', 'h'))}</span></li>
          <li><span class="k">Lieu</span><span class="v">${esc(activity.place)}</span></li>
          <li><span class="k">Prix</span><span class="v">${nf(activity.cost)} LP</span></li>
          <li><span class="k">Nouveau solde</span><span class="v">${nf(ACT.balance(ref))} LP</span></li>
          <li><span class="k">Points de fidélité</span><span class="v earned">+${nf(ACT.pointsFor(activity))} pts · total ${nf(ACT.loyaltyPoints(ref))} pts</span></li>
        </ul>
        <p class="note">${emailed ? 'La réception a bien reçu votre réservation.' : 'Votre réservation est enregistrée.'} Elle apparaît déjà dans Mon calendrier.</p>
        <div class="done-actions">
          <a class="btn btn-primary" href="${esc(back.replace('#portefeuille', '#calendrier'))}">Voir mon calendrier</a>
          <a class="btn" href="${esc(back)}">Retour à Mon portefeuille</a>
        </div>`;
      document.body.classList.add('confirmed');
      scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
