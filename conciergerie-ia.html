<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conciergerie — Shelter&amp;Co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #E6E8EA;
      --panel: #F1F2F3;
      --line: #1A1C1F;
      --ink: #1A1C1F;
      --grey: #7A7F86;
      --blue: #A6CBEA;
      --blue-ink: #3F6F98;
      --shadow: 0 1px 2px rgba(26,28,31,.06), 0 14px 30px -10px rgba(26,28,31,.22);
      --shadow-up: 0 2px 4px rgba(26,28,31,.08), 0 26px 44px -12px rgba(26,28,31,.30);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Archivo', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
    }

    .back {
      color: var(--grey);
      text-decoration: none;
      margin-bottom: 24px;
      transition: color .2s ease;
    }

    .back:hover { color: var(--ink); }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }

    h1 {
      font-weight: 850;
      font-stretch: 62%;
      font-size: clamp(3rem, 9vw, 6rem);
      line-height: 0.85;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue);
      border: 1px solid var(--line);
      padding: 8px 12px;
      box-shadow: var(--shadow);
    }

    .status::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--ink);
      animation: blink 2s ease-in-out infinite;
    }

    /* ---------- Fenêtre de discussion ---------- */
    .chat {
      flex: 1;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 82%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: rise .35s cubic-bezier(.2,.7,.2,1) both;
    }

    .msg .who { color: var(--grey); }

    .msg .bubble {
      padding: 14px 16px;
      border: 1px solid var(--line);
      font-size: 1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 1px 2px rgba(26,28,31,.06), 0 8px 18px -8px rgba(26,28,31,.22);
    }

    .msg.bot { align-self: flex-start; }
    .msg.bot .bubble { background: #fff; }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.user .bubble { background: var(--blue); }

    .msg.error .bubble { background: var(--bg); color: var(--grey); border-style: dashed; }

    /* points d'attente pendant que l'assistant écrit */
    .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
    .typing i {
      width: 7px;
      height: 7px;
      background: var(--ink);
      animation: dot 1.2s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 16px;
    }

    .suggestions[hidden] { display: none; }

    .suggestions button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(26,28,31,.06), 0 6px 14px -8px rgba(26,28,31,.22);
      transition: background .2s ease, transform .2s ease;
    }

    .suggestions button:hover { background: var(--blue); transform: translateY(-2px); }

    .composer {
      display: flex;
      align-items: stretch;
      border-top: 1px solid var(--line);
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      padding: 16px 20px;
      font-family: 'Archivo', sans-serif;
      font-size: 1rem;
      line-height: 1.4;
      max-height: 140px;
      color: var(--ink);
    }

    .composer textarea::placeholder { color: var(--grey); }

    .composer:focus-within { box-shadow: inset 0 0 0 2px var(--blue-ink); }

    .send {
      flex-shrink: 0;
      width: 64px;
      border: none;
      border-left: 1px solid var(--line);
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .2s ease, color .2s ease;
    }

    .send:hover:not(:disabled) { background: var(--blue); color: var(--ink); }
    .send:disabled { opacity: .35; cursor: not-allowed; }
    .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }

    .note { color: var(--grey); margin-top: 12px; text-align: center; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes dot {
      0%, 80%, 100% { transform: scale(.5); opacity: .4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes blink { 50% { opacity: .25; } }

    @media (max-width: 760px) {
      .topbar { padding: 14px 16px; }
      main { padding: 20px 16px 16px; }
      .log { padding: 16px; }
      .msg { max-width: 92%; }
      .suggestions { padding: 0 16px 14px; }
      .composer textarea { padding: 14px 16px; }
      .send { width: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .msg { animation: none; }
      .log { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar mono">
    <span>Shelter&amp;Co</span>
    <span>Legacy Hospitality Group</span>
  </header>

  <main>
    <a class="back mono" id="back" href="shelter-co.html#espace">← Mon espace</a>

    <div class="head">
      <h1>Conciergerie</h1>
      <span class="status mono">Assistant disponible 24&nbsp;h/24</span>
    </div>

    <section class="chat" aria-label="Discussion avec l'assistant de conciergerie">
      <div class="log" id="log" role="log" aria-live="polite"></div>

      <div class="suggestions" id="suggestions">
        <button type="button" class="mono">Horaires du petit-déjeuner</button>
        <button type="button" class="mono">Jusqu'à quelle heure puis-je rester ?</button>
        <button type="button" class="mono">Comment accéder au Wi-Fi ?</button>
        <button type="button" class="mono">Un restaurant près de l'hôtel ?</button>
      </div>

      <form class="composer" id="composer">
        <label for="input" class="mono" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Votre question</label>
        <textarea id="input" rows="1" maxlength="2000" placeholder="Posez votre question…"></textarea>
        <button class="send" id="send" type="submit" aria-label="Envoyer" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </section>

    <p class="note mono">L'assistant répond aux questions. Pour toute demande (réservation, room service…), contactez la réception.</p>
  </main>

  <script>
    const ref = new URLSearchParams(location.search).get('ref') || '';
    if (ref) {
      document.getElementById('back').href =
        'shelter-co.html?ref=' + encodeURIComponent(ref) + '#espace';
    }

    const log = document.getElementById('log');
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const suggestions = document.getElementById('suggestions');

    // Historique envoyé au serveur (texte uniquement)
    const history = [];
    let busy = false;

    function addMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      const who = document.createElement('span');
      who.className = 'who mono';
      who.textContent = role === 'user' ? 'Vous' : 'Conciergerie';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.append(who, bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return { wrap, bubble };
    }

    function typing(bubble) {
      bubble.innerHTML = '<span class="typing" aria-label="L\'assistant écrit"><i></i><i></i><i></i></span>';
    }

    function refreshSend() {
      send.disabled = busy || !input.value.trim();
    }

    function autosize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    }

    // Lecture du flux Server-Sent Events renvoyé par /api/chat
    async function readStream(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf('\n\n')) >= 0) {
          const chunk = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          const line = chunk.split('\n').find((l) => l.startsWith('data: '));
          if (line) onEvent(JSON.parse(line.slice(6)));
        }
      }
    }

    async function ask(question) {
      question = question.trim();
      if (!question || busy) return;
      busy = true;
      suggestions.hidden = true;
      input.value = '';
      autosize();
      refreshSend();

      addMessage('user', question);
      history.push({ role: 'user', content: question });

      const { wrap, bubble } = addMessage('assistant', '');
      typing(bubble);
      let answer = '';
      let failed = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref, messages: history }),
        });
        if (!response.ok || !response.body) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'L\'assistant est momentanément indisponible.');
        }
        await readStream(response, (event) => {
          if (event.text) {
            answer += event.text;
            bubble.textContent = answer;
            log.scrollTop = log.scrollHeight;
          }
          if (event.error) failed = event.error;
        });
      } catch (err) {
        failed = err && err.message && !/fetch/i.test(err.message)
          ? err.message
          : 'Connexion à l\'assistant impossible. Le site doit être ouvert via le serveur (serveur.py).';
      }

      if (answer.trim()) {
        history.push({ role: 'assistant', content: answer });
      } else {
        // pas de réponse : on retire la question de l'historique pour pouvoir la reposer
        history.pop();
      }
      if (failed && !answer.trim()) {
        wrap.classList.add('error');
        bubble.textContent = failed;
      }

      busy = false;
      refreshSend();
      input.focus();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      ask(input.value);
    });

    // Entrée pour envoyer, Maj+Entrée pour aller à la ligne
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        ask(input.value);
      }
    });

    input.addEventListener('input', () => { autosize(); refreshSend(); });

    suggestions.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) ask(btn.textContent);
    });

    addMessage('assistant',
      'Bonjour et bienvenue chez Shelter&Co. Je suis votre assistant de conciergerie : ' +
      'posez-moi vos questions sur votre séjour, l\'hôtel ou le quartier.');
  </script>
</body>
</html>
