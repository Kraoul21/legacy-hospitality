<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conciergerie — Shelter&amp;Co</title>
  <script>
    // Arrivée depuis une tuile de Mon espace : le contenu arrive en glissant
    try {
      if (sessionStorage.getItem('lhg-portal')) document.documentElement.classList.add('portal-in');
      sessionStorage.removeItem('lhg-portal');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/urbain.css">
  <style>
    :root { --accent: var(--blue); }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 24px 20px;
      display: flex;
      flex-direction: column;
      animation: rise .8s var(--ease) both;
    }

    .back { align-self: flex-start; margin-bottom: 22px; }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 7vw, 4.4rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid color-mix(in srgb, #1FAF55 35%, transparent);
    }

    /* voyant « disponible » : vert franc avec une onde qui pulse */
    .status::before {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1FAF55;
      box-shadow: 0 0 0 0 rgba(31, 175, 85, 0.55);
      animation: live 1.8s ease-out infinite;
    }

    /* ---------- Fenêtre de discussion ---------- */
    .chat {
      position: relative;
      flex: 1;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
    }

    /* halo de couleur : dégradé qui épouse l'arrondi (pas de cercle flouté qui déborde) */
    .chat::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(360px 260px at 100% 0%, color-mix(in srgb, var(--blue) 32%, transparent), transparent 70%);
      opacity: .6;
      z-index: -1;
      pointer-events: none;
      transition: opacity .45s ease;
    }

    .log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .msg {
      max-width: 82%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: rise .4s var(--ease) both;
    }

    .msg .who { color: var(--muted); padding: 0 6px; }

    .msg .bubble {
      padding: 14px 18px;
      border-radius: 22px;
      font-size: 1rem;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.bot { align-self: flex-start; }

    .msg.bot .bubble {
      background: #fff;
      border: 1px solid var(--stroke);
      border-top-left-radius: 8px;
      box-shadow: 0 10px 24px -18px rgba(60, 45, 30, 0.4);
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }

    .msg.user .bubble {
      background: var(--blue);
      color: var(--on-accent);
      border-top-right-radius: 8px;
      box-shadow: 0 14px 30px -16px color-mix(in srgb, var(--blue) 80%, transparent);
    }

    .msg.error .bubble { color: var(--muted); border-style: dashed; }

    .typing { display: inline-flex; gap: 5px; padding: 4px 0; }

    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text);
      animation: dot 1.2s ease-in-out infinite;
    }

    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }

    /* suggestions : affichées dans le fil, sous la dernière réponse */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 92%;
      margin-top: -2px;
      animation: rise .4s var(--ease) both;
    }

    .suggestions button {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--blue) 40%, transparent);
      background: color-mix(in srgb, var(--blue) 10%, transparent);
      color: var(--text);
      cursor: pointer;
      transition: background .25s ease, color .25s ease, transform .3s var(--ease);
    }

    .suggestions button:hover {
      background: var(--blue);
      color: var(--on-accent);
      transform: translateY(-2px);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 0 14px 14px;
      padding: 6px 6px 6px 8px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--stroke);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .composer:focus-within {
      border-color: color-mix(in srgb, var(--blue) 60%, transparent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 16%, transparent);
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: none;
      background: transparent;
      box-shadow: none;
      padding: 12px 12px;
      max-height: 140px;
      line-height: 1.4;
    }

    .composer textarea:focus { box-shadow: none; background: transparent; }

    .send {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: var(--blue);
      color: var(--on-accent);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .3s var(--ease), filter .2s ease, opacity .2s ease;
    }

    .send:hover:not(:disabled) { transform: rotate(-45deg); filter: brightness(1.08); }
    .send:disabled { opacity: .35; cursor: not-allowed; }
    .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .note { color: var(--muted); margin-top: 14px; text-align: center; }

    @keyframes dot {
      0%, 80%, 100% { transform: scale(.5); opacity: .4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes live {
      0%   { box-shadow: 0 0 0 0 rgba(31, 175, 85, 0.55); }
      70%  { box-shadow: 0 0 0 9px rgba(31, 175, 85, 0); }
      100% { box-shadow: 0 0 0 0 rgba(31, 175, 85, 0); }
    }

    @media (max-width: 760px) {
      main { padding: 20px 16px 14px; }
      .log { padding: 16px; }
      .msg { max-width: 92%; }
      .composer { margin: 0 10px 10px; }
    }

  </style>
</head>
<body>

  <main>
    <a class="back mono" id="back" href="shelter-co.html#espace">← Mon espace</a>

    <div class="head">
      <h1>Conciergerie</h1>
      <span class="status mono">Assistant disponible 24&nbsp;h/24</span>
    </div>

    <section class="chat" aria-label="Discussion avec l'assistant de conciergerie">
      <div class="log" id="log" role="log" aria-live="polite"></div>


      <form class="composer" id="composer">
        <label for="input" class="mono" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Votre question</label>
        <textarea id="input" rows="1" maxlength="2000" placeholder="Posez votre question…"></textarea>
        <button class="send" id="send" type="submit" aria-label="Envoyer" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </section>

    <p class="note mono">Réponses automatiques. Pour toute autre demande, la réception est joignable 24&nbsp;h/24.</p>
  </main>

  <script src="assets/activites-data.js"></script>
  <script src="assets/conciergerie-data.js"></script>
  <script>
    // ------------------------------------------------------------------
    // Assistant de conciergerie à réponses programmées (gratuit, sans IA).
    // Chaque sujet : une question type, des mots-clés, une réponse.
    // Données de démonstration — à adapter aux vraies infos de l'hôtel.
    // ------------------------------------------------------------------

    const RESERVATIONS = {
      '012345': {
        room: '412 — Suite Deluxe',
        arrival: 'lundi 12 octobre',
        departure: 'jeudi 15 octobre',
        checkout: '14:00',
        tier: 'Silver',
        points: '12 480',
        toGold: '2 520',
        lp: '1 500',
      },
    };

    const ref = new URLSearchParams(location.search).get('ref') || '';
    const r = RESERVATIONS[ref] || null;
    // points et solde LP à jour (activités réservées)
    const ACT = window.LHG_ACTIVITES;
    if (r && ACT && ACT.STAYS[ref]) {
      const f = (n) => new Intl.NumberFormat('fr-FR').format(n).replace(/\u202F/g, '\u00A0');
      const pts = ACT.loyaltyPoints(ref);
      r.points = f(pts);
      r.toGold = f(Math.max(0, ACT.STAYS[ref].nextTierAt - pts));
      r.lp = f(ACT.balance(ref));
    }

    // Les 100 questions-réponses sont dans assets/conciergerie-data.js (un seul fichier à modifier)
    const DATA = window.CONCIERGE;
    const TOPICS = DATA.topics.map((t) => ({ ...t }));
    const INDEX = Object.fromEntries(TOPICS.map((t, i) => [t.id, i]));
    TOPICS.forEach((t) => {
      const answer = t.a;
      t.a = () => answer(r);                       // réponse personnalisée avec la réservation
      t.next = t.next.map((id) => INDEX[id]);      // suggestions : identifiants → positions
    });
    const FALLBACK = DATA.fallback;
    const START = DATA.start.map((id) => INDEX[id]);
    const POPULAR = DATA.popular.map((id) => INDEX[id]);

    // ------------------------------------------------------------------

    if (ref) {
      document.getElementById('back').href =
        'shelter-co.html?ref=' + encodeURIComponent(ref) + '#espace';
    }

    const log = document.getElementById('log');
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let busy = false;

    // Un mot-clé précédé de « ~ » est faible : il ne compte que pour moitié
    // (« matin », « venir »… apparaissent dans beaucoup de questions).

    // minuscules, sans accents ni ponctuation : « Petit-déj ? » → « petit dej »
    const normalize = (s) => ' ' + s.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim() + ' ';

    TOPICS.forEach((t) => {
      t.norm = t.keys.map((k) => ({
        text: normalize(k.replace(/^~/, '')).trim(),
        weight: k.startsWith('~') ? 0.5 : 1,
      }));
    });

    // Le sujet dont le plus de mots-clés apparaissent (les expressions longues comptent plus)
    function findTopic(text) {
      const n = normalize(text);
      let best = null;
      let bestScore = 0;
      TOPICS.forEach((t) => {
        let score = 0;
        t.norm.forEach((k) => {
          if (n.includes(' ' + k.text)) score += k.text.split(' ').length * k.weight;
        });
        if (score > bestScore) { best = t; bestScore = score; }
      });
      return best;
    }

    function addMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      const who = document.createElement('span');
      who.className = 'who mono';
      who.textContent = role === 'user' ? 'Vous' : 'Conciergerie';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.append(who, bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    // une seule rangée de suggestions à la fois, placée sous la dernière réponse
    function clearSuggestions() {
      log.querySelectorAll('.suggestions').forEach((el) => {
        el.style.display = 'none'; // libère la place avant la suppression (évite les restes d'affichage)
        el.remove();
      });
    }

    function showSuggestions(indexes) {
      clearSuggestions();
      if (!indexes.length) return;
      const group = document.createElement('div');
      group.className = 'suggestions';
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', 'Suggestions de questions');
      indexes.forEach((i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'mono';
        b.dataset.index = i;
        b.textContent = TOPICS[i].q;
        group.appendChild(b);
      });
      log.appendChild(group);
      log.scrollTop = log.scrollHeight;
    }

    function refreshSend() {
      send.disabled = busy || !input.value.trim();
    }

    function autosize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    }

    // topicIndex : sujet choisi directement via une suggestion
    function ask(question, topicIndex) {
      question = question.trim();
      if (!question || busy) return;
      busy = true;
      input.value = '';
      autosize();
      refreshSend();
      clearSuggestions();

      addMessage('user', question);
      const topic = Number.isInteger(topicIndex) ? TOPICS[topicIndex] : findTopic(question);

      const bubble = addMessage('assistant', '');
      bubble.innerHTML = '<span class="typing" aria-label="L\'assistant écrit"><i></i><i></i><i></i></span>';

      // petit délai d'écriture pour un échange plus naturel
      setTimeout(() => {
        if (topic) {
          bubble.textContent = topic.a();
          showSuggestions(topic.next);
        } else {
          bubble.textContent = FALLBACK;
          showSuggestions(POPULAR);
        }
        busy = false;
        refreshSend();
        log.scrollTop = log.scrollHeight;
        input.focus();
      }, reduce ? 0 : 500 + Math.random() * 400);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      ask(input.value);
    });

    // Entrée pour envoyer, Maj+Entrée pour aller à la ligne
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        ask(input.value);
      }
    });

    input.addEventListener('input', () => { autosize(); refreshSend(); });

    log.addEventListener('click', (e) => {
      const btn = e.target.closest('.suggestions button');
      if (btn) ask(btn.textContent, Number(btn.dataset.index));
    });

    addMessage('assistant',
      'Bonjour et bienvenue chez Shelter&Co. Je suis votre assistant de conciergerie : ' +
      'posez-moi vos questions sur votre séjour, l\'hôtel ou les activités du quartier.');
    showSuggestions(START);
  
  </script>
</body>
</html>
